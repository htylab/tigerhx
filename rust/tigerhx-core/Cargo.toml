[package]
name = "tigerhx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-independent TigerHx processing: NIfTI, ONNX segmentation, AHA, checks, legacy .mat, workspace"

[dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-native", "api-20"] }
flate2 = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
regex = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
