# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python compile

on:
  push:
    branches: [ "main", "claude/gifted-fermat-i039r8" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:  # used by release.yml

permissions:
  contents: read

jobs:
  build:

    #runs-on: ubuntu-18.04
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest']
        py: ['tigercinegui', 'tigerhxgui']
        include:
          # the Tk GUI draws with matplotlib and resizes with scikit-image
          - py: tigercinegui
            deps: onnxruntime scikit-image matplotlib certifi
            excludes: ''
          # the web GUI only needs numpy, nibabel, onnxruntime, scipy.ndimage/io
          # and pywebview; leaving out the rest of scipy also drops matplotlib,
          # Pillow and Tcl/Tk that scipy.stats would otherwise bring in.
          # scipy.io.matlab imports scipy.sparse, which (scipy 1.13) imports
          # sparse.csgraph and sparse.linalg, so those stay. The smoke test below
          # fails the build if something needed is left out.
          - py: tigerhxgui
            deps: onnxruntime certifi pywebview
            excludes: >-
              matplotlib mpl_toolkits PIL tkinter _tkinter skimage IPython pandas sympy pytest
              setuptools pkg_resources distutils
              scipy.stats scipy.optimize scipy.integrate scipy.interpolate scipy.spatial
              scipy.signal scipy.odr scipy.cluster scipy.datasets scipy.misc scipy.fftpack
              scipy.constants

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller ${{ matrix.deps }}
    - name: Run PyInstaller
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        EXCLUDES=""
        for m in ${{ matrix.excludes }}; do EXCLUDES="$EXCLUDES --exclude-module $m"; done
        pyinstaller -c -p ./tigerhx --collect-data tigerhx --add-data "./tigerhx/exe/onnxruntime_providers_shared.dll;onnxruntime/capi" $EXCLUDES -F ./tigerhx/${{ matrix.py }}.py
        ls -l dist
    - name: Smoke test the executable
      if: matrix.py == 'tigerhxgui'
      run: |
        pip install onnx
        python tools/smoke_exe.py dist/tigerhxgui.exe

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.py }}-${{ matrix.os }}
        path: dist/*
    # the real window: file and folder dialogs, every way of adding cases
    - name: UI test
      if: matrix.py == 'tigerhxgui'
      run: |
        pip install playwright pywinauto pillow
        python tools/ui_test_exe.py dist/tigerhxgui.exe ui-shots
    - uses: actions/upload-artifact@v4
      if: always() && matrix.py == 'tigerhxgui'
      with:
        name: ui-test-${{ matrix.py }}
        path: ui-shots
        if-no-files-found: ignore
