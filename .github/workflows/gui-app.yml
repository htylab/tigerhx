# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python compile

on:
  push:
    branches: [ "main", "claude/gifted-fermat-i039r8" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'After building, publish a GitHub release with this tag (e.g. v0.1.0); empty = build only'
        required: false
        default: ''
      release_notes:
        description: 'Release notes (Markdown)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:

    #runs-on: ubuntu-18.04
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest']
        py: ['tigercinegui', 'tigerhxgui']
        include:
          # the Tk GUI draws with matplotlib and resizes with scikit-image
          - py: tigercinegui
            deps: onnxruntime scikit-image matplotlib certifi
            excludes: ''
          # the web GUI only needs numpy, nibabel, onnxruntime, scipy.ndimage/io
          # and pywebview; leaving out the rest of scipy also drops matplotlib,
          # Pillow and Tcl/Tk that scipy.stats would otherwise bring in.
          # scipy.io.matlab imports scipy.sparse, which (scipy 1.13) imports
          # sparse.csgraph and sparse.linalg, so those stay. The smoke test below
          # fails the build if something needed is left out.
          - py: tigerhxgui
            deps: onnxruntime certifi pywebview
            excludes: >-
              matplotlib mpl_toolkits PIL tkinter _tkinter skimage IPython pandas sympy pytest
              setuptools pkg_resources distutils
              scipy.stats scipy.optimize scipy.integrate scipy.interpolate scipy.spatial
              scipy.signal scipy.odr scipy.cluster scipy.datasets scipy.misc scipy.fftpack
              scipy.constants

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller ${{ matrix.deps }}
    - name: Run PyInstaller
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        EXCLUDES=""
        for m in ${{ matrix.excludes }}; do EXCLUDES="$EXCLUDES --exclude-module $m"; done
        pyinstaller -c -p ./tigerhx --collect-data tigerhx --add-data "./tigerhx/exe/onnxruntime_providers_shared.dll;onnxruntime/capi" $EXCLUDES -F ./tigerhx/${{ matrix.py }}.py
        ls -l dist
    - name: Smoke test the executable
      if: matrix.py == 'tigerhxgui'
      run: |
        pip install onnx
        python tools/smoke_exe.py dist/tigerhxgui.exe

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.py }}-${{ matrix.os }}
        path: dist/*

  # Publishes both executables, zipped, for a version tag: push an annotated
  # tag (its message becomes the release notes), publish a release on GitHub,
  # or run this workflow manually with a tag. An existing release only gets
  # the files.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Publish the executables
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.release_tag || github.ref_name }}
        NOTES: ${{ inputs.release_notes }}
      run: |
        cd artifacts
        for d in */; do
          name="${d%/}"; name="${name%-windows-latest}"
          (cd "$d" && zip -9 -q "../${name}-${TAG}.zip" *.exe)
        done
        ls -l *.zip
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "$TAG" *.zip --repo "$GITHUB_REPOSITORY" --clobber
        else
          if [ -z "$NOTES" ]; then
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.sha' || true)
            if [ -n "$obj" ]; then NOTES=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq .message); fi
          fi
          gh release create "$TAG" *.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "$NOTES"
        fi
